[project]
name = "skilllint"
version = "1.0.0"
description = "Private lint of agent skills: structure, triggers, secrets, prompt injection, broken references."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp>=2.0"]

[project.scripts]
skilllint-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
